services:
  postgres:
    image: postgres:16-alpine
    container_name: artsgoz-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: artsgoz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d artsgoz"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - artsgoz-network

  artsgoz-backend:
    build:
      context: ./artsgoz-backend
      dockerfile: Dockerfile
    container_name: artsgoz-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GIN_MODE: "debug"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "user"
      DB_PASSWORD: "password"
      DB_NAME: "artsgoz"
      DB_SSL_MODE: "disable"
      UPLOAD_DIR: "/app/uploads"
      UPLOAD_BASE_URL: "/uploads"
      JWT_SECRET: "artsgoz_super_secret_jwt_key_2026"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - artsgoz-network

  artsgoz-backoffice:
    build:
      context: ./artsgoz-monorepo
      dockerfile: Dockerfile
      args:
        APP_NAME: artsgoz-backoffice
        VITE_API_BASE_URL: http://localhost:8080/api
        VITE_AKSORNSARA_FRONTEND_URL: http://localhost:4201
    container_name: artsgoz-backoffice
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - artsgoz-backend
    networks:
      - artsgoz-network

  aksornsara-frontend:
    build:
      context: ./artsgoz-monorepo
      dockerfile: Dockerfile
      args:
        APP_NAME: aksornsara-frontend
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: aksornsara-frontend
    restart: unless-stopped
    ports:
      - "4201:80"
    depends_on:
      - artsgoz-backend
    networks:
      - artsgoz-network

  artsgoz-frontend:
    build:
      context: ./artsgoz-monorepo
      dockerfile: Dockerfile
      args:
        APP_NAME: artsgoz-frontend
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: artsgoz-frontend
    restart: unless-stopped
    ports:
      - "4300:80"
    depends_on:
      - artsgoz-backend
    networks:
      - artsgoz-network

volumes:
  postgres_data:
  backend_uploads:

networks:
  artsgoz-network:
    driver: bridge

